function categoryBreakdown(rs,total){const items=groups(rs,'category');if(!items.length)return '<div class="empty">Chưa có chi tiêu trong thời gian này.</div>';let acc=0;const stops=items.map((x,i)=>{const a=acc;acc+=x.value/total*100;return chartColors[i%chartColors.length]+' '+a+'% '+acc+'%';});return `<div class="category-layout"><div class="donut" role="img" aria-label="Cơ cấu chi tiêu theo hạng mục" style="background:conic-gradient(${stops.join(',')})"><div class="donut-center"><b>${items.length}</b><small>hạng mục</small></div></div><div class="category-legend">${items.slice(0,5).map((x,i)=>`<button data-drill="category" data-value="${esc(x.name)}"><i style="background:${chartColors[i%chartColors.length]}"></i><span>${esc(x.name)}<small>${money(x.value)}</small></span><b>${(x.value/total*100).toFixed(1)}%</b></button>`).join('')}${items.length>5?'<button class="link" data-tab="chart">Xem tất cả hạng mục →</button>':''}</div></div>`;}

function transactionRow(r,select=false){return `<div class="row">${select?`<input type="checkbox" data-select="${esc(r.id)}" aria-label="Chọn ${esc(r.merchant||r.detail)}" ${selected.has(r.id)?'checked':''}>`:''}<button class="avatar" data-edit="${esc(r.id)}">${logoContent(r)}</button><button class="row-main" data-edit="${esc(r.id)}"><b>${esc(r.merchant||r.detail||'Chưa nhận diện')}</b><small>${esc(r.category||'Chưa phân loại')} · ${esc(r.source||'Nhập tay')}</small></button><button class="row-amount" data-edit="${esc(r.id)}">${r.credit>0?'+ '+money(r.credit):money(Math.abs(r.debit||0))}<small>${normal(r.status)==='thất bại'?'Thất bại':counted(r)?'Tính chi tiêu':'Không tính chi'}${normal(r.classification)==='chưa nhận diện'?' · ⚑':''}</small></button></div>`;}
function filtered(){return selectedRecords().filter(r=>(filter!=='unknown'||normal(r.classification)==='chưa nhận diện')&&(filter!=='spend'||spend(r)>0)&&(filter!=='excluded'||!counted(r))&&(!merchantFilter||normal(r.merchant)===normal(merchantFilter))&&(!categoryFilter||normal(r.category)===normal(categoryFilter))&&(!query||normal([r.detail,r.category,r.merchant,r.source,r.payment,r.date].join(' ')).includes(normal(query)))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));}

function chatScope(q){let rs=selectedRecords(),label=periodTitle();const dates=[...q.matchAll(/(\d{1,2})\/(\d{1,2})\/(\d{4})/g)].map(m=>m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'));if(dates.length){if(dates.some(d=>isNaN(Date.parse(d))||new Date(d+'T00:00:00Z').toISOString().slice(0,10)!==d))return {error:'Ngày không hợp lệ. Anh dùng dd/MM/yyyy nhé.'};const a=dates[0],b=dates[1]||a;if(a>b)return {error:'Ngày bắt đầu cần trước hoặc bằng ngày kết thúc.'};rs=data.filter(r=>r.date>=a&&r.date<=b);label=displayDate(a)+(a===b?'':' – '+displayDate(b));}
 else if(q.includes('hom nay')||q.includes('hom qua')){let d=today();if(q.includes('hom qua'))d=new Date(Date.parse(d)-86400000).toISOString().slice(0,10);rs=data.filter(r=>r.date===d);label=displayDate(d);}
 else if(q.includes('toan bo')){rs=data;label='Toàn bộ dữ liệu';}
 else {const m=q.match(/thang\s+(\d{1,2})(?:[\/\s-]+(20\d{2}))?/),y=q.match(/nam\s+(20\d{2})/);if(m){if(Number(m[1])<1||Number(m[1])>12)return {error:'Tháng cần từ 1 đến 12.'};const mo=(m[2]||y?.[1]||today().slice(0,4))+'-'+m[1].padStart(2,'0');rs=monthRecords(mo);label='Tháng '+mo.split('-').reverse().join('/');}else if(q.includes('thang nay')||q.includes('thang truoc')){let mo=today().slice(0,7);if(q.includes('thang truoc')){const [yy,mm]=mo.split('-').map(Number);mo=new Date(Date.UTC(yy,mm-2,1)).toISOString().slice(0,7);}rs=monthRecords(mo);label='Tháng '+mo.split('-').reverse().join('/');}else if(y||q.includes('nam nay')){const yy=y?.[1]||today().slice(0,4);rs=data.filter(r=>String(r.date).slice(0,4)===yy);label='Năm '+yy;}}
 return {rs,label};}
function answerChat(question){const q=chatFold(question),scope=chatScope(q);if(scope.error)return {text:scope.error};const {rs,label}=scope,total=sum(rs),head=label+': ',tx=rs.filter(r=>spend(r)>0),actions=[];
 if(q.includes('dong bo')||q.includes('cap nhat du lieu'))return {text:'Bấm Đồng bộ để tải lại dữ liệu từ sheet.',actions:[{key:'refresh',label:'Đồng bộ ngay'}]};
 if(q.includes('ket noi')||q.includes('url'))return {text:'URL Apps Script có thể đặt trong APPS_SCRIPT_URL ở HTML. Nếu cần, anh cũng có thể nhập URL một lần tại đây.',actions:[{key:'connect',label:'Kết nối dữ liệu'}]};
 if(q.includes('xuat')&&q.includes('csv'))return {text:'Xuất CSV theo bộ lọc '+periodTitle()+'.',actions:[{key:'export',label:'Xuất CSV'}]};
 if(q.includes('ngan sach')){const budget=Number(cfg.budget)||0;if(!budget)return {text:'Anh chưa đặt ngân sách tháng trên thiết bị này.',actions:[{key:'budget',label:'Đặt ngân sách'}]};const mo=today().slice(0,7),spent=sum(monthRecords(mo));return {text:'Ngân sách mỗi tháng: '+money(budget)+'\nTháng '+mo.split('-').reverse().join('/')+': đã chi '+money(spent)+'. '+(spent>budget?'Vượt '+money(spent-budget):'Còn '+money(budget-spent))+'.\nNgân sách này lưu riêng trên thiết bị.',actions:[{key:'budget',label:'Sửa ngân sách'}]};}
 if(q.includes('phan loai')||q.includes('chua nhan dien')){const n=rs.filter(r=>normal(r.classification)==='chưa nhận diện');return {text:head+n.length+' giao dịch chưa nhận diện. Tổng ghi nợ '+money(n.reduce((a,r)=>a+Math.abs(r.debit||0),0))+', trong đó '+money(sum(n))+' đang tính vào chi tiêu. Nút dưới mở các dòng của bộ lọc trên màn hình.',actions:[{key:'unknown',label:'Kiểm tra giao dịch'}]};}
 if(q.includes('lon nhat')||q.includes('khoan chi cao nhat')){const biggest=tx.slice().sort((a,b)=>spend(b)-spend(a))[0];return {text:biggest?head+'khoản chi lớn nhất là '+money(spend(biggest))+' tại '+(biggest.merchant||biggest.detail||'Chưa nhận diện')+' ngày '+displayDate(biggest.date)+'.':head+'chưa có khoản chi.'};}
 const merchant=[...new Set(rs.map(r=>String(r.merchant||'').trim()).filter(Boolean))].sort((a,b)=>b.length-a.length).find(m=>(' '+q.replace(/[^a-z0-9\s]/g,' ')+' ').includes(' '+chatFold(m).replace(/[^a-z0-9\s]/g,' ')+' '));
 if(merchant){const matches=rs.filter(r=>normal(r.merchant)===normal(merchant));return {text:head+merchant+' tổng chi '+money(sum(matches))+' qua '+matches.filter(r=>spend(r)>0).length+' giao dịch tính chi tiêu.'};}
 const cat=[...new Set(rs.map(r=>String(r.category||'').trim()).filter(Boolean))].sort((a,b)=>b.length-a.length).find(c=>q.includes(chatFold(c)));
 if(cat){const matches=rs.filter(r=>normal(r.category)===normal(cat));return {text:head+cat+' tổng chi '+money(sum(matches))+', chiếm '+(total?sum(matches)/total*100:0).toFixed(1)+'% trong kỳ.'};}
 if(q.includes('noi chi')||q.includes('app nao')||q.includes('hang muc')||q.includes('loai chi')||q.includes('top')){const key=q.includes('hang muc')||q.includes('loai chi')?'category':'merchant',items=groups(rs,key).slice(0,5);return {text:head+(items.length?'\n'+items.map((x,i)=>(i+1)+'. '+x.name+': '+money(x.value)+' ('+(total?x.value/total*100:0).toFixed(1)+'%)').join('\n'):'chưa có chi tiêu.'),actions:[{key:'chart',label:'Mở phân tích'}]};}
 if(q.includes('bao nhieu')||q.includes('tong chi')||q.includes('da chi')||q.includes('chi tieu')||q.includes('thong ke')||q.includes('tom tat'))return {text:head+'tổng chi '+money(total)+' qua '+tx.length+' giao dịch.\nChỉ tính Ghi nợ của dòng Tính chi tiêu = Có và không thất bại; chưa trừ hoàn tiền.',actions:[{key:'list',label:'Xem giao dịch'}]};
 return {text:'Diko hiện là trợ lý dữ liệu theo quy tắc, chưa phải AI trò chuyện tự do. Anh thử hỏi: “Hôm nay chi bao nhiêu?”, “Tháng 9/2026 Grab hết bao nhiêu?”, “Nơi chi nhiều nhất?” hoặc “Từ 01/09/2026 đến 30/09/2026 tổng chi?”.'};}
function askChat(question){const q=String(question||'').trim().slice(0,500);if(!q)return;const response=answerChat(q),context=(isDemo?'DỮ LIỆU MẪU':'Dữ liệu đọc lúc '+(lastSync?new Date(lastSync).toLocaleTimeString('vi-VN'):'chưa đồng bộ'));chatHistory.push({role:'user',text:q},{role:'pet',text:response.text,actions:response.actions||[],context});chatHistory=chatHistory.slice(-40);chatDraft='';petMood='happy';tab='assistant';render();const feed=$('#chat-feed');if(feed)feed.scrollTop=feed.scrollHeight;}
function openConnection(){$('#overlay').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><form id="settings-form"><div class="section-head"><h2>Kết nối dữ liệu</h2><button type="button" data-close="1">×</button></div><label>URL Apps Script<input name="url" type="url" required value="${esc(cfg.url||'')}" placeholder="https://script.google.com/macros/s/…/exec"></label><button class="btn wide">Lưu & kết nối</button><p class="switch-note">Không cần key. URL trong APPS_SCRIPT_URL ở HTML được ưu tiên khi mở lại app.</p></form></div></div>`;}
function openBudget(){$('#overlay').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><form id="budget-form"><div class="section-head"><h2>Ngân sách mỗi tháng</h2><button type="button" data-close="1">×</button></div><label>Ngân sách (VNĐ)<input name="budget" type="number" min="0" max="1000000000000" step="1" required value="${Number(cfg.budget)||0}"></label><button class="btn wide">Lưu ngân sách</button><p class="switch-note">Lưu riêng trên thiết bị này, áp dụng cùng mức cho mỗi tháng.</p></form></div></div>`;}

function closeModal(){$('#overlay').innerHTML='';}
function edit(id){const r=data.find(x=>x.id===id);if(!r)return;$('#overlay').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div>${formView(r)}</div></div>`;}
function bulk(){if(!selected.size)return;$('#overlay').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><form id="bulk-form"><div class="section-head"><h2>Phân loại ${selected.size} giao dịch</h2><button type="button" data-close="1">×</button></div><p class="switch-note">Chỉ các trường được đánh dấu mới cập nhật cho tất cả dòng đã chọn.</p>${['merchant','category','include','classification'].map(k=>`<div class="checkline"><input type="checkbox" name="use-${k}" id="use-${k}" ${['category','classification'].includes(k)?'checked':''}><label for="use-${k}">${({merchant:'Tên app / nơi chi',category:'Loại chi tiêu',include:'Tính vào chi tiêu',classification:'Trạng thái phân loại'})[k]}</label></div>${k==='merchant'?'<input name="merchant" placeholder="Tên nơi chi">':`<select name="${k}">${options(k==='category'?categories:k==='include'?['Có','Không']:['Đã phân loại','Chưa nhận diện'],k==='category'?'Ăn uống':k==='include'?'Có':'Đã phân loại')}</select>`}`).join('')}<button class="btn wide" style="margin-top:24px">Lưu phân loại</button></form></div></div>`;}

function validUrl(url){try{const u=new URL(url);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(u.pathname)&&!u.search&&!u.hash;}catch{return false;}}
function resetBridge(){epoch++;$('#bridge').src='about:blank';bridgeWindow=null;bridgeOrigin='';channel=null;connectedKey='';for(const p of pending.values()){clearTimeout(p.timer);p.reject(new Error('Kết nối đã thay đổi.'));}pending.clear();connectPromise=null;}
window.addEventListener('message',e=>{
 const d=e.data;if(!d||d.nonce!==channel||!/^https:\/\/[a-zA-Z0-9-]+\.googleusercontent\.com$/.test(e.origin))return;
 if(d.type==='centurion-ready'&&connectPromise){bridgeWindow=e.source;bridgeOrigin=e.origin;connectPromise.resolve();return;}
 if(d.type!=='centurion-response'||e.source!==bridgeWindow||e.origin!==bridgeOrigin)return;
 const p=pending.get(d.id);if(!p)return;clearTimeout(p.timer);pending.delete(d.id);d.error?p.reject(new Error(d.error)):p.resolve(d.result);
});
async function connect(){
 const key=cfg.url;if(bridgeWindow&&connectedKey===key)return;
 if(connectPromise)return connectPromise.promise;
 channel=crypto.randomUUID();const nonce=channel;let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b;});connectPromise={promise,resolve,reject};
 const timer=setTimeout(()=>reject(new Error('Không kết nối được. Kiểm tra URL /exec, quyền Anyone và ALLOWED_ORIGIN.')),30000);
 $('#bridge').src=cfg.url+'?nonce='+encodeURIComponent(nonce);
 try{await promise;connectedKey=key;}finally{clearTimeout(timer);if(channel===nonce)connectPromise=null;}
}
async function request(payload){await connect();const id=crypto.randomUUID();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Chưa nhận được xác nhận. Hãy đồng bộ để kiểm tra kết quả trước khi lưu lại.'));},45000);pending.set(id,{resolve,reject,timer});bridgeWindow.postMessage({type:'centurion-request',nonce:channel,id,payload:{...payload}},bridgeOrigin);});}
async function sync(manual=false){
 if(syncing||busy)return;if(!cfg.url){if(manual)toast('Vào Cài đặt để kết nối sheet.');return;}
 if($('#transaction-form')||$('#bulk-form')){if(manual)toast('Lưu hoặc đóng biểu mẫu trước khi đồng bộ.');return;}
 syncing=true;status();const currentEpoch=epoch;
 try{const r=await request({action:'list'});if(currentEpoch!==epoch)return;if(!Array.isArray(r.records))throw new Error('Phản hồi không hợp lệ.');data=r.records;isDemo=false;lastSync=r.syncedAt;syncError='';selected.clear();render();if(manual)toast('Đã đồng bộ với Raw data.');}
 catch(e){if(currentEpoch===epoch){toast(e.message);syncError=e.message;}}
 finally{syncing=false;status();}
}
async function save(action,payload,form){if(busy)return;busy=true;form.querySelectorAll('button').forEach(b=>b.disabled=true);status();let saved=false;
 try{
 if(isDemo){if(cfg.url)throw new Error('Chưa đồng bộ được dữ liệu thật. Đóng biểu mẫu và kết nối trước khi lưu.');if(action==='add')data.unshift({...payload.patch,id:payload.id,version:payload.id,source:'Nhập tay'});else payload.items.forEach(x=>Object.assign(data.find(r=>r.id===x.id),x.patch));}
 else await request({action,...payload});saved=true;closeModal();selected.clear();if(tab==='plus'){tab='list';query='';filter='all';merchantFilter='';categoryFilter='';periodMode='month';$('#month').value=payload.patch.date.slice(0,7);}render();toast(isDemo?'Đã lưu trong dữ liệu mẫu.':'Đã lưu vào Raw data.');
 }catch(e){toast(e.message);}finally{busy=false;form.querySelectorAll('button').forEach(b=>b.disabled=false);status();}
 if(saved&&!isDemo)await sync();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||busy)return;
 if(b.dataset.ask)askChat(b.dataset.ask);
 if(b.dataset.connect)openConnection();
 if(b.dataset.chatClear){chatHistory=[];chatDraft='';petMood='idle';render();}
 if(b.dataset.chatAction){const k=b.dataset.chatAction;if(k==='refresh')sync(true);if(k==='budget')openBudget();if(k==='connect')openConnection();if(k==='export')exportCsv();if(k==='unknown'){tab='list';filter='unknown';query='';merchantFilter='';categoryFilter='';render();}if(k==='chart'||k==='list'){tab=k;render();}}
 if(b.dataset.tab){tab=b.dataset.tab;closeModal();render();window.scrollTo(0,0);}
 if(b.dataset.period){periodMode=b.dataset.period;selected.clear();limit=50;render();}
 if(b.dataset.edit)edit(b.dataset.edit);
 if(b.dataset.close)closeModal();
 if(b.dataset.unknown){tab='list';filter='unknown';query='';merchantFilter='';categoryFilter='';render();}
 if(b.dataset.filter){filter=b.dataset.filter;selected.clear();limit=50;render();}
 if(b.dataset.drill){tab='list';filter='all';query='';merchantFilter='';categoryFilter='';if(b.dataset.drill==='merchant')merchantFilter=b.dataset.value;else if(b.dataset.drill==='category')categoryFilter=b.dataset.value;else query=b.dataset.value;render();window.scrollTo(0,0);}
 if(b.dataset.clearDrill){merchantFilter='';categoryFilter='';render();}
 if(b.dataset.more){limit+=50;render();}
 if(b.dataset.selectAll){selected=new Set(filtered().slice(0,500).map(r=>r.id));render();}
 if(b.dataset.deselect){selected.clear();render();}
 if(b.dataset.bulk)bulk();
 if(b.dataset.disconnect){resetBridge();cfg.url='';syncError='';localStorage.setItem('centurion-config',JSON.stringify(cfg));data=demoRecords();isDemo=true;lastSync='';selected.clear();render();toast(APPS_SCRIPT_URL?'Đã tạm ngắt. Mở lại app sẽ kết nối URL trong code.':'Đã ngắt kết nối.');}
 if(b.dataset.export)exportCsv();
});
document.addEventListener('change',e=>{if(e.target.dataset.select){if(e.target.checked){if(selected.size>=500){e.target.checked=false;toast('Mỗi lần tối đa 500 dòng.');return;}selected.add(e.target.dataset.select);}else selected.delete(e.target.dataset.select);$('#bulk-holder').innerHTML=bulkBar();}});
document.addEventListener('input',e=>{if(e.target.id==='chat-input')chatDraft=e.target.value;if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;limit=50;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);}});
$('#year').addEventListener('change',()=>{selectedYear=$('#year').value;selected.clear();limit=50;render();});$('#month').addEventListener('change',()=>{if(!$('#month').value)return;selected.clear();limit=50;render();});$('#refresh').addEventListener('click',()=>sync(true));
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target,fd=new FormData(f);
 if(f.id==='chat-form'){askChat(fd.get('question'));return;}
 if(f.id==='range-form'){const a=$('#date-start').value,b=$('#date-end').value;if(!a||!b||a>b){toast('Ngày bắt đầu phải nhỏ hơn hoặc bằng ngày kết thúc.');return;}rangeStart=a;rangeEnd=b;periodMode='range';selected.clear();limit=50;render();return;}
 if(f.id==='settings-form'){const url=String(fd.get('url')).trim();if(!validUrl(url)){toast('URL phải có dạng https://script.google.com/macros/s/…/exec');return;}if(syncing){toast('Đợi lần đồng bộ hiện tại kết thúc.');return;}resetBridge();cfg.url=url;localStorage.setItem('centurion-config',JSON.stringify(cfg));closeModal();await sync(true);}
 if(f.id==='budget-form'){cfg.budget=Math.max(0,Number(fd.get('budget'))||0);localStorage.setItem('centurion-config',JSON.stringify(cfg));closeModal();render();toast('Đã lưu ngân sách trên thiết bị này.');}
 if(f.id==='transaction-form'){
 const patch=Object.fromEntries(fd);patch.debit=-Math.abs(Number(patch.debit));patch.credit=Number(patch.credit)||0;
 if(!patch.debit&&!patch.credit){toast('Nhập số tiền chi ra hoặc nhận vào.');return;}
 if(!f.dataset.id){if(!f.dataset.newId)f.dataset.newId='app_'+crypto.randomUUID();await save('add',{id:f.dataset.newId,patch},f);}
 else await save('update',{items:[{id:f.dataset.id,version:f.dataset.version,patch}]},f);
 }
 if(f.id==='bulk-form'){const patch={};['merchant','category','include','classification'].forEach(k=>{if(fd.get('use-'+k))patch[k]=fd.get(k);});if(!Object.keys(patch).length){toast('Chọn trường cần cập nhật.');return;}const items=[...selected].map(id=>({id,version:data.find(r=>r.id===id).version,patch}));await save('update',{items},f);}
});
function exportCsv(){const keys=['date','source','detail','merchant','category','debit','credit','include','payment','status'];const safe=v=>{v=String(v??'');if(/^[=+@\-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};const text='\ufeff'+[keys.map(safe).join(','),...selectedRecords().map(r=>keys.map(k=>safe(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='priority-'+(periodMode==='year'?selectedYear:periodMode==='range'?rangeStart+'_'+rangeEnd:$('#month').value)+(isDemo?'-demo':'')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
setInterval(()=>{if(document.visibilityState==='visible')sync();},60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync();});
data=demoRecords();render();if(cfg.url){if(validUrl(cfg.url))sync();else{syncError='URL trong cấu hình không hợp lệ. Cần URL Apps Script /exec.';status();}}
</script></body></html>
