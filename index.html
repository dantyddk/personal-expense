<script>

const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={home:'M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9',list:'M5 4h14v16H5zM8 8h8M8 12h8M8 16h5',plus:'M12 5v14M5 12h14',chart:'M4 20V10M10 20V4M16 20v-8M22 20H2',settings:'M4 7h16M4 17h16M8 4v6M16 14v6',refresh:'M20 7a8 8 0 1 0 0 10M20 3v5h-5',arrow:'m9 5 7 7-7 7',close:'m5 5 14 14M19 5 5 19'};
const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[k]||paths.home}"/></svg>`;
const money=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(n)+' ₫';
const short=n=>Math.abs(n)>=1e6?new Intl.NumberFormat('vi-VN',{maximumFractionDigits:1}).format(n/1e6)+'tr':new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(n/1000)+'k';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

const sum=rs=>rs.reduce((n,r)=>n+spend(r),0);
const tabs=[['home','Tổng quan'],['list','Giao dịch'],['plus','Thêm mới'],['chart','Phân tích'],['settings','Cài đặt']];
const merchantDomains={grab:'grab.com',shopee:'shopee.vn',lazada:'lazada.vn',momo:'momo.vn',be:'be.com.vn',ministop:'ministop.vn',circlek:'circlek.com.vn',familymart:'famima.vn',gs25:'gs25.com.vn',highlandscoffee:'highlandscoffee.com.vn',phuclong:'phuclong.com.vn',starbucks:'starbucks.vn',thecoffeehouse:'thecoffeehouse.com',apple:'apple.com',netflix:'netflix.com',spotify:'spotify.com',pizza4ps:'pizza4ps.com',bachhoaxanh:'bachhoaxanh.com',winmart:'winmart.vn',uniqlo:'uniqlo.com',cgv:'cgv.vn',acb:'acb.com.vn',vietcombank:'vietcombank.com.vn',vpbank:'vpbank.com.vn'};
function domainFor(r){let raw=String(r.domain||'').trim().toLowerCase();if(raw){raw=raw.replace(/^https?:\/\//,'').split('/')[0];if(/^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/.test(raw))return raw;}const key=normal(r.merchant).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]/g,'');return merchantDomains[key]||'';}
function logoContent(r){const fallback='<span class="logo-fallback">'+esc((r.merchant||'?').slice(0,2).toUpperCase())+'</span>',domain=domainFor(r);return fallback+(domain?'<img loading="lazy" referrerpolicy="no-referrer" src="https://www.google.com/s2/favicons?domain='+encodeURIComponent(domain)+'&sz=128" alt="'+esc(r.merchant||'Logo')+'" onerror="this.remove()">':'');}
const categories=['Ăn uống','Di chuyển','Nhu yếu phẩm','Mua sắm','Hóa đơn','Sức khỏe','Giải trí','Trả góp','Chăm sóc cá nhân','Giáo dục','Dịch vụ','Quà tặng','Chuyển tiền'];
let cfg={};try{cfg=JSON.parse(localStorage.getItem('centurion-config')||'{}')||{};}catch{}
if(APPS_SCRIPT_URL.trim())cfg.url=APPS_SCRIPT_URL.trim();
let data=[],tab='home',filter='all',query='',merchantFilter='',categoryFilter='',selected=new Set(),limit=50,busy=false,syncing=false,isDemo=true,lastSync='',syncError='',channel=null,bridgeOrigin='',bridgeWindow=null,connectPromise=null,epoch=0,connectedKey='';
let selectedYear=today().slice(0,4),periodMode='month',rangeStart=today().slice(0,7)+'-01',rangeEnd=today();
const pending=new Map();
$('#month').value=today().slice(0,7);$('#date-start').value=rangeStart;$('#date-end').value=rangeEnd;$('#refresh').innerHTML=icon('refresh');
function demoRecords(){
 const places=[['Grab','Di chuyển'],['Shopee','Mua sắm'],['Ministop','Nhu yếu phẩm'],['Highlands Coffee','Ăn uống'],['Apple','Hóa đơn'],['Pizza 4P’s','Ăn uống']];let a=[];const d=new Date(today()+'T12:00:00Z');
 for(let i=0;i<84;i++){let t=new Date(d);t.setUTCDate(t.getUTCDate()-Math.floor(i/2));const [merchant,category]=places[i%6];a.push({id:'demo-'+i,date:t.toISOString().slice(0,10),detail:'Dữ liệu mẫu · '+merchant,merchant,category,debit:-(25000+(i*17317)%480000),credit:0,include:i%13?'Có':'Không',classification:i%11?'Đã phân loại':'Chưa nhận diện',status:'Thành công',source:i%2?'MoMo':'ACB',payment:i%2?'Ví MoMo':'ACB',version:'demo-'+i});}return a;
}
function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;el.setAttribute('role','status');document.body.append(el);setTimeout(()=>el.remove(),5000);}
function monthRecords(m=$('#month').value){return data.filter(r=>String(r.date).slice(0,7)===m);}
function selectedRecords(){if(periodMode==='year')return data.filter(r=>String(r.date).slice(0,4)===selectedYear); if(periodMode==='range')return data.filter(r=>r.date>=rangeStart&&r.date<=rangeEnd);return monthRecords();}
function periodBounds(){if(periodMode==='range')return [rangeStart,rangeEnd];if(periodMode==='year')return [selectedYear+'-01-01',selectedYear+'-12-31'];const [y,m]=$('#month').value.split('-').map(Number);return [$('#month').value+'-01',$('#month').value+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')];}
const displayDate=d=>String(d).split('-').reverse().join('/');
function periodTitle(){if(periodMode==='year')return 'Năm '+selectedYear;if(periodMode==='range')return displayDate(rangeStart)+' – '+displayDate(rangeEnd);return 'Tháng '+$('#month').value.split('-').reverse().join('/');}
function updatePeriodControls(){$('#period-controls').hidden=['settings','plus'].includes(tab);$('#year-controls').hidden=periodMode!=='year';const years=[...new Set([today().slice(0,4),selectedYear,...data.map(r=>String(r.date).slice(0,4)).filter(y=>/^\d{4}$/.test(y))])].sort().reverse();$('#year').innerHTML=years.map(y=>`<option value="${y}" ${y===selectedYear?'selected':''}>Năm ${y}</option>`).join('');$('#month-controls').hidden=periodMode!=='month';$('#range-form').hidden=periodMode!=='range';document.querySelectorAll('[data-period]').forEach(b=>{b.classList.toggle('active',b.dataset.period===periodMode);b.setAttribute('aria-pressed',String(b.dataset.period===periodMode));});$('#period-label').textContent=periodTitle()+' · '+selectedRecords().length+' giao dịch';}
function dailySeries(rs){const [start,end]=periodBounds(),span=Math.max(1,Math.round((Date.parse(end)-Date.parse(start))/86400000)+1),step=Math.max(1,Math.ceil(span/31)),values=Array(Math.ceil(span/step)).fill(0);rs.forEach(r=>{const day=Math.floor((Date.parse(r.date)-Date.parse(start))/86400000);if(day>=0&&day<span)values[Math.floor(day/step)]+=spend(r);});const labels=values.map((_,i)=>{const a=new Date(Date.parse(start)+i*step*86400000).toISOString().slice(0,10),b=new Date(Date.parse(start)+Math.min(span-1,(i+1)*step-1)*86400000).toISOString().slice(0,10);return displayDate(a)+(a===b?'':' – '+displayDate(b));});return {values,labels,start,end,span,step};}
function previousMonth(){const [y,m]=$('#month').value.split('-').map(Number);return new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,7);}
function groups(rs,key){const g=new Map();rs.forEach(r=>{let k=String(r[key]||'Chưa nhận diện').trim();let norm=normal(k);if(!g.has(norm))g.set(norm,{name:k,value:0,count:0});let x=g.get(norm);x.value+=spend(r);if(spend(r)>0)x.count++;});return [...g.values()].filter(x=>x.value>0).sort((a,b)=>b.value-a.value);}
function status(){const mode=syncing?'Đang đồng bộ…':syncError?'Lỗi kết nối · '+syncError:isDemo?'Dữ liệu mẫu · chưa kết nối sheet':lastSync?'Đồng bộ '+new Date(lastSync).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'Chưa đồng bộ';$('#status').className='status'+(isDemo?' demo':'');$('#status').innerHTML='<i class="dot"></i>'+esc(mode);$('#refresh').disabled=syncing||busy;}
function render(){
 $('#title').textContent=tabs.find(x=>x[0]===tab)[1];$('.tabs').innerHTML=tabs.map(([k,n])=>`<button data-tab="${k}" class="${k===tab?'active ':''}${k==='plus'?'plus':''}" aria-current="${k===tab?'page':'false'}">${icon(k)}<span>${n}</span></button>`).join('');
 updatePeriodControls();status();$('#view').innerHTML=({home:homeView,list:listView,plus:()=>formView(),chart:chartView,settings:settingsView}[tab])();
}
function rankView(items,total,key){return items.length?items.map((x,i)=>`<button class="rank" style="display:block;width:100%;text-align:left" data-drill="${key}" data-value="${esc(x.name)}"><div class="rank-head"><span class="merchant-name">${key==='merchant'?`<span class="brand-logo">${logoContent(data.find(r=>normal(r.merchant)===normal(x.name))||{merchant:x.name})}</span>`:''}${esc(x.name)}</span><span>${money(x.value)}</span></div><div class="progress"><i style="width:${total?x.value/total*100:0}%;opacity:${Math.max(.35,1-i*.075)}"></i></div><small>${total?(x.value/total*100).toFixed(1):0}% · ${x.count} giao dịch</small></button>`).join(''):'<div class="empty">Chưa có chi tiêu trong thời gian này.</div>';}
const chartColors=['#cdb185','#8dafa2','#b495a8','#a1aacc','#c89476','#b5bb88','#8ba7b8','#ac9475'];
function spendingChart(rs){
 const daily=dailySeries(rs);const values=periodMode==='year'?Array.from({length:12},(_,i)=>sum(rs.filter(r=>String(r.date).slice(5,7)===String(i+1).padStart(2,'0')))):daily.values;
 const labels=periodMode==='year'?values.map((_,i)=>'Tháng '+(i+1)):daily.labels,max=Math.max(...values,1),w=600,h=148,pad=8;
 const points=values.map((n,i)=>[pad+(w-pad*2)*(values.length===1?.5:i/(values.length-1)),h-12-n/max*(h-24)]),path=points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)).join(' ');
 const fill=path+' L '+points[points.length-1][0]+' '+(h-12)+' L '+points[0][0]+' '+(h-12)+' Z';
 return `<div class="trend-summary"><span>Đỉnh kỳ <b>${money(Math.max(...values,0))}</b></span><span>${periodMode==='year'?'Theo tháng':daily.step===1?'Theo ngày':'Gộp mỗi '+daily.step+' ngày'}</span></div><svg class="trend-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Xu hướng chi tiêu ${esc(periodTitle())}"><defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cdb185" stop-opacity=".25"/><stop offset="100%" stop-color="#cdb185" stop-opacity="0"/></linearGradient></defs>${[.25,.5,.75,1].map(f=>`<line x1="0" y1="${h-12-f*(h-24)}" x2="${w}" y2="${h-12-f*(h-24)}" stroke="#ffffff0e" stroke-dasharray="3 5"/>`).join('')}<path d="${fill}" fill="url(#trendFill)" stroke="none"/><path d="${path}" fill="none" stroke="#d3b98b" stroke-width="2.8" stroke-linejoin="round"/>${points.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${values.length===1?4:2.5}" fill="#d3b98b" stroke="none"><title>${esc(labels[i])}: ${money(values[i])}</title></circle>`).join('')}</svg><div class="axis"><span>${periodMode==='year'?'Tháng 1':displayDate(daily.start)}</span><span>${periodMode==='year'?'Tháng 12':displayDate(daily.end)}</span></div>`;
}
function categoryBreakdown(rs,total){const items=groups(rs,'category');if(!items.length)return '<div class="empty">Chưa có chi tiêu trong thời gian này.</div>';let acc=0;const stops=items.map((x,i)=>{const a=acc;acc+=x.value/total*100;return chartColors[i%chartColors.length]+' '+a+'% '+acc+'%';});return `<div class="category-layout"><div class="donut" role="img" aria-label="Cơ cấu chi tiêu theo hạng mục" style="background:conic-gradient(${stops.join(',')})"><div class="donut-center"><b>${items.length}</b><small>hạng mục</small></div></div><div class="category-legend">${items.slice(0,5).map((x,i)=>`<button data-drill="category" data-value="${esc(x.name)}"><i style="background:${chartColors[i%chartColors.length]}"></i><span>${esc(x.name)}<small>${money(x.value)}</small></span><b>${(x.value/total*100).toFixed(1)}%</b></button>`).join('')}${items.length>5?'<button class="link" data-tab="chart">Xem tất cả hạng mục →</button>':''}</div></div>`;}
function homeView(){
 const rs=selectedRecords(),total=sum(rs),prev=periodMode==='month'?sum(monthRecords(previousMonth())):periodMode==='year'?sum(data.filter(r=>String(r.date).slice(0,4)===String(Number(selectedYear)-1))):0,change=prev?(total-prev)/prev*100:null,tx=rs.filter(r=>spend(r)>0),unknown=rs.filter(r=>normal(r.classification)==='chưa nhận diện').length;
 const series=dailySeries(rs);let elapsed=series.span;if(periodMode==='month'&&$('#month').value===today().slice(0,7))elapsed=Number(today().slice(8));if(periodMode==='year'&&selectedYear===today().slice(0,4))elapsed=Math.floor((Date.parse(today())-Date.parse(selectedYear+'-01-01'))/86400000)+1;
 const budget=periodMode==='month'?(Number(cfg.budget)||0):0,top=groups(rs,'category')[0];
 return `${isDemo?(cfg.url?'<div class="notice">Đang chờ dữ liệu từ Google Sheet. Số liệu bên dưới là dữ liệu mẫu, chưa phải dữ liệu thật.</div>':'<div class="notice">Đang xem dữ liệu mẫu. <button data-tab="settings">Kết nối Google Sheet →</button></div>'):''}
 <section class="spending-overview"><div class="overview-heading"><span>Tổng chi tiêu</span><button class="quick-add" data-tab="plus" aria-label="Thêm khoản chi">${icon('plus')}</button></div><div class="spending-total">${new Intl.NumberFormat('vi-VN').format(total)}<small>₫</small></div><div class="overview-meta"><span>${esc(periodTitle())}</span>${change!==null?`<span class="comparison ${change>0?'up':''}">${change>0?'↑':'↓'} ${Math.abs(change).toFixed(1)}% ${periodMode==='year'?'so với cả năm trước':'so với cả tháng trước'}</span>`:'<span>Chi tiêu đã ghi nhận</span>'}</div></section>
 <div class="metrics compact-metrics"><div class="metric"><div class="metric-icon">${icon('list')}</div><div><div class="muted">Giao dịch chi</div><div class="value">${tx.length}</div></div></div><div class="metric"><div class="metric-icon">${icon('chart')}</div><div><div class="muted">Trung bình / ngày</div><div class="value">${short(total/elapsed)}</div><div class="muted">${elapsed} ngày trong kỳ</div></div></div></div>
 <div class="card trend-card"><div class="section-head"><h2>Xu hướng chi tiêu</h2><button class="link" data-tab="chart">Phân tích →</button></div>${spendingChart(rs)}</div>
 ${budget?`<div class="card budget-card"><div class="section-head"><h2>Ngân sách tháng</h2><span class="muted">${(total/budget*100).toFixed(0)}% đã dùng</span></div><div class="rank-head"><span>${money(total)}</span><span class="muted">/ ${money(budget)}</span></div><div class="progress"><i style="width:${Math.min(total/budget*100,100)}%;background:${total>budget?'#cfa68c':'#c5ad7e'}"></i></div><p class="switch-note">${total>budget?'Vượt '+money(total-budget):'Còn lại '+money(budget-total)}</p></div>`:''}
 <div class="card"><div class="section-head"><h2>Tiền đi đâu?</h2><button class="link" data-tab="chart">Chi tiết →</button></div>${categoryBreakdown(rs,total)}${top?`<div class="insight-note"><b>${esc(top.name)}</b> chiếm ${(top.value/total*100).toFixed(1)}% chi tiêu trong kỳ.</div>`:''}</div>
 ${unknown?`<button class="review-banner" data-unknown="1"><span><b>${unknown} giao dịch cần phân loại</b><small>Kiểm tra để theo dõi chi tiêu rõ hơn</small></span>${icon('arrow')}</button>`:''}
 <div class="desktop-grid"><div class="card"><div class="section-head"><h2>Nơi chi nhiều nhất</h2><span class="muted">${groups(rs,'merchant').length} nơi chi</span></div>${rankView(groups(rs,'merchant').slice(0,4),total,'merchant')}</div><div class="card"><div class="section-head"><h2>Giao dịch gần đây</h2><button class="link" data-tab="list">Tất cả →</button></div>${rs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,4).map(r=>transactionRow(r)).join('')||'<div class="empty">Chưa có giao dịch.</div>'}</div></div>`;
}

function transactionRow(r,select=false){return `<div class="row">${select?`<input type="checkbox" data-select="${esc(r.id)}" aria-label="Chọn ${esc(r.merchant||r.detail)}" ${selected.has(r.id)?'checked':''}>`:''}<button class="avatar" data-edit="${esc(r.id)}">${logoContent(r)}</button><button class="row-main" data-edit="${esc(r.id)}"><b>${esc(r.merchant||r.detail||'Chưa nhận diện')}</b><small>${esc(r.category||'Chưa phân loại')} · ${esc(r.source||'Nhập tay')}</small></button><button class="row-amount" data-edit="${esc(r.id)}">${r.credit>0?'+ '+money(r.credit):money(Math.abs(r.debit||0))}<small>${normal(r.status)==='thất bại'?'Thất bại':counted(r)?'Tính chi tiêu':'Không tính chi'}${normal(r.classification)==='chưa nhận diện'?' · ⚑':''}</small></button></div>`;}
function filtered(){return selectedRecords().filter(r=>(filter!=='unknown'||normal(r.classification)==='chưa nhận diện')&&(filter!=='spend'||spend(r)>0)&&(filter!=='excluded'||!counted(r))&&(!merchantFilter||normal(r.merchant)===normal(merchantFilter))&&(!categoryFilter||normal(r.category)===normal(categoryFilter))&&(!query||normal([r.detail,r.category,r.merchant,r.source,r.payment,r.date].join(' ')).includes(normal(query)))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));}
function listView(){const rs=filtered();return `<input class="search" id="search" type="search" value="${esc(query)}" placeholder="Tìm nơi chi, nội dung, hạng mục…" aria-label="Tìm giao dịch"><div class="filters">${[['all','Tất cả'],['spend','Chi tiêu'],['unknown','Chưa nhận diện'],['excluded','Không tính chi']].map(([k,n])=>`<button class="pill ${filter===k?'active':''}" data-filter="${k}">${n}</button>`).join('')}${merchantFilter||categoryFilter?`<button class="pill active" data-clear-drill="1">${esc(merchantFilter||categoryFilter)} ×</button>`:''}</div><div class="section-head"><span class="muted">${rs.length} giao dịch · ${money(sum(rs))}</span><button class="link" data-select-all="1">Chọn ${Math.min(rs.length,500)} dòng</button></div><div id="bulk-holder">${bulkBar()}</div><div class="card" style="padding:8px 18px">${rs.length?rs.slice(0,limit).map((r,i)=>`${!i||rs[i-1].date!==r.date?`<div class="day-title">${esc(String(r.date).split('-').reverse().join('/'))}</div>`:''}${transactionRow(r,true)}`).join(''):'<div class="empty">Không có giao dịch phù hợp.</div>'}${rs.length>limit?'<button class="btn secondary wide" data-more="1" style="margin:16px 0">Xem thêm 50 giao dịch</button>':''}</div>`;}
function bulkBar(){return selected.size?`<div class="bulk"><span>Đã chọn ${selected.size}</span><button data-bulk="1">Phân loại →</button><button data-deselect="1" aria-label="Bỏ chọn">×</button></div>`:'';}
function chartView(){const rs=selectedRecords(),total=sum(rs),months=[...new Set(rs.map(r=>String(r.date).slice(0,7)).filter(x=>/^\d{4}-\d{2}$/.test(x)))].sort();let vals=months.map(m=>sum(rs.filter(r=>String(r.date).slice(0,7)===m))),max=Math.max(...vals,1);return `<div class="card"><div class="section-head"><h2>Chi tiêu theo tháng</h2><span class="muted">Theo thời gian đã chọn</span></div><div class="horizontal"><div class="monthly-bars">${months.map((m,i)=>`<div class="monthly-col"><span>${short(vals[i])}</span><i style="height:${Math.max(vals[i]/max*104,2)}px;opacity:${m===$('#month').value?1:.5}"></i><small>${m.slice(5)}/${m.slice(2,4)}</small></div>`).join('')}</div></div></div><div class="card"><div class="section-head"><h2>Theo loại chi tiêu</h2><span class="muted">${money(total)}</span></div>${rankView(groups(rs,'category'),total,'category')}</div><div class="card"><div class="section-head"><h2>Theo nơi chi / app</h2><span class="muted">Chạm để xem giao dịch</span></div>${rankView(groups(rs,'merchant'),total,'merchant')}</div><div class="card"><h2>Theo nguồn dữ liệu</h2>${rankView(groups(rs,'source'),total,'source')}<p class="switch-note">Chỉ cộng Ghi nợ của dòng “Tính chi tiêu = Có”; không cộng giao dịch thất bại. Ghi có hiển thị riêng trong danh sách và không tự trừ vào tổng chi tiêu.</p></div>`;}
function options(values,current){return [...new Set([current,...values].filter(x=>x!==undefined&&x!==null))].map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v||'Chưa có thông tin')}</option>`).join('');}
function formView(r=null){const edit=!!r;return `<form id="transaction-form" data-id="${esc(r?.id||'')}" data-version="${esc(r?.version||'')}"><div class="card"><div class="section-head"><h2>${edit?'Chỉnh sửa giao dịch':'Ghi lại một khoản chi'}</h2>${edit?'<button type="button" data-close="1" aria-label="Đóng">×</button>':'<span class="badge">Nhập tay</span>'}</div><label>Ngày giao dịch<input type="date" name="date" required value="${esc(r?.date||today())}"></label><div class="two"><label>Ghi nợ / chi ra (VNĐ)<input type="number" name="debit" inputmode="numeric" min="0" max="1000000000000" step="1" required value="${Math.abs(r?.debit||0)}"></label><label>Ghi có / nhận vào (VNĐ)<input type="number" name="credit" inputmode="numeric" min="0" max="1000000000000" step="1" value="${r?.credit||0}"></label></div><label>Nơi chi / tên app<input name="merchant" list="merchants" maxlength="2000" value="${esc(r?.merchant||'')}" placeholder="Ví dụ: Grab, Shopee, Highlands…"></label><datalist id="merchants">${groups(data,'merchant').map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist><label>Tên miền logo<input name="domain" placeholder="Ví dụ: grab.com (để trống sẽ tự nhận diện)" value="${esc(r?.domain||'')}"></label><label>Loại chi tiêu<select name="category">${options([...categories,...data.map(x=>x.category)],r?.category||'Ăn uống')}</select></label><label>Nội dung giao dịch<textarea name="detail" required maxlength="2000" placeholder="Ghi chú khoản chi…">${esc(r?.detail||'')}</textarea></label><label>Nguồn thanh toán<input name="payment" value="${esc(r?.payment||'')}" placeholder="Ví dụ: ACB, Ví MoMo, tiền mặt…"></label><div class="two"><label>Tính vào chi tiêu<select name="include">${options(['Có','Không'],r?.include||'Có')}</select></label><label>Trạng thái<select name="status">${options(['Thành công','Thất bại',''],r?.status??'Thành công')}</select></label></div><label>Phân loại<select name="classification">${options(['Đã phân loại','Chưa nhận diện'],r?.classification||'Đã phân loại')}</select></label>${edit?`<p class="switch-note">Nguồn: ${esc(r.source)} · ID: ${esc(r.id)}<br>Đối soát: ${esc(r.reconcile||'—')}</p>`:''}<button class="btn wide" type="submit">${edit?'Lưu thay đổi':'Thêm giao dịch'}</button><p class="switch-note">${isDemo?'Chế độ mẫu: chỉ lưu tạm trong phiên xem này.':'Lưu trực tiếp vào tab Raw data. Không thay đổi tab ACB.'}</p></div></form>`;}
function settingsView(){return `<div class="connection">${icon('settings')}<div><b>${isDemo?'Kết nối Google Sheets':'Đã kết nối Raw data'}</b><p>Sheet là nguồn dữ liệu chính của app.</p></div></div><form id="settings-form"><div class="card"><h2>Kết nối dữ liệu</h2><p class="switch-note">Dán URL triển khai Apps Script có đuôi /exec; app tự nhớ URL để kết nối lại lần sau.</p><label>URL Apps Script<input name="url" type="url" required value="${esc(cfg.url||'')}" placeholder="https://script.google.com/macros/s/…/exec"></label><button class="btn wide" type="submit">Lưu & kết nối</button><p class="switch-note">Anh có thể điền URL trực tiếp vào APPS_SCRIPT_URL trong HTML. URL trong code được ưu tiên mỗi khi mở app; không cần nhập access key.</p></div></form><form id="budget-form"><div class="card"><h2>Ngân sách mỗi tháng</h2><p class="switch-note">Áp dụng cùng một mức cho các tháng; lưu riêng trên thiết bị này.</p><label>Ngân sách (VNĐ)<input name="budget" type="number" inputmode="numeric" min="0" max="1000000000000" step="1" value="${Number(cfg.budget)||0}"></label><button class="btn secondary wide">Lưu ngân sách</button></div></form><div class="card"><h2>Đồng bộ & dữ liệu</h2><p class="switch-note">Tự tải lại mỗi 60 giây khi app đang mở, và khi quay lại màn hình. Trong lúc nhập hoặc sửa giao dịch, app tạm dừng tự tải lại để giữ nội dung đang điền.<br><br>Thay đổi từ sheet cần có ID riêng cho mỗi dòng. Dòng mới thiếu ID sẽ được Apps Script tự cấp ID khi đồng bộ.</p><button class="small-button" data-export="1">Xuất CSV thời gian đã chọn</button> <button class="small-button" data-disconnect="1">Tạm ngắt kết nối</button><p class="switch-note">Phong cách lấy cảm hứng từ Vietcombank Priority. Đây là app quản lý chi tiêu cá nhân.</p></div>`;}
function closeModal(){$('#overlay').innerHTML='';}
function edit(id){const r=data.find(x=>x.id===id);if(!r)return;$('#overlay').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div>${formView(r)}</div></div>`;}
function bulk(){if(!selected.size)return;$('#overlay').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><form id="bulk-form"><div class="section-head"><h2>Phân loại ${selected.size} giao dịch</h2><button type="button" data-close="1">×</button></div><p class="switch-note">Chỉ các trường được đánh dấu mới cập nhật cho tất cả dòng đã chọn.</p>${['merchant','category','include','classification'].map(k=>`<div class="checkline"><input type="checkbox" name="use-${k}" id="use-${k}" ${['category','classification'].includes(k)?'checked':''}><label for="use-${k}">${({merchant:'Tên app / nơi chi',category:'Loại chi tiêu',include:'Tính vào chi tiêu',classification:'Trạng thái phân loại'})[k]}</label></div>${k==='merchant'?'<input name="merchant" placeholder="Tên nơi chi">':`<select name="${k}">${options(k==='category'?categories:k==='include'?['Có','Không']:['Đã phân loại','Chưa nhận diện'],k==='category'?'Ăn uống':k==='include'?'Có':'Đã phân loại')}</select>`}`).join('')}<button class="btn wide" style="margin-top:24px">Lưu phân loại</button></form></div></div>`;}

function validUrl(url){try{const u=new URL(url);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(u.pathname)&&!u.search&&!u.hash;}catch{return false;}}
function resetBridge(){epoch++;$('#bridge').src='about:blank';bridgeWindow=null;bridgeOrigin='';channel=null;connectedKey='';for(const p of pending.values()){clearTimeout(p.timer);p.reject(new Error('Kết nối đã thay đổi.'));}pending.clear();connectPromise=null;}
window.addEventListener('message',e=>{
 const d=e.data;if(!d||d.nonce!==channel||!/^https:\/\/[a-zA-Z0-9-]+\.googleusercontent\.com$/.test(e.origin))return;
 if(d.type==='centurion-ready'&&connectPromise){bridgeWindow=e.source;bridgeOrigin=e.origin;connectPromise.resolve();return;}
 if(d.type!=='centurion-response'||e.source!==bridgeWindow||e.origin!==bridgeOrigin)return;
 const p=pending.get(d.id);if(!p)return;clearTimeout(p.timer);pending.delete(d.id);d.error?p.reject(new Error(d.error)):p.resolve(d.result);
});
async function connect(){
 const key=cfg.url;if(bridgeWindow&&connectedKey===key)return;
 if(connectPromise)return connectPromise.promise;
 channel=crypto.randomUUID();const nonce=channel;let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b;});connectPromise={promise,resolve,reject};
 const timer=setTimeout(()=>reject(new Error('Không kết nối được. Kiểm tra URL /exec, quyền Anyone và ALLOWED_ORIGIN.')),30000);
 $('#bridge').src=cfg.url+'?nonce='+encodeURIComponent(nonce);
 try{await promise;connectedKey=key;}finally{clearTimeout(timer);if(channel===nonce)connectPromise=null;}
}
async function request(payload){await connect();const id=crypto.randomUUID();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Chưa nhận được xác nhận. Hãy đồng bộ để kiểm tra kết quả trước khi lưu lại.'));},45000);pending.set(id,{resolve,reject,timer});bridgeWindow.postMessage({type:'centurion-request',nonce:channel,id,payload:{...payload}},bridgeOrigin);});}
async function sync(manual=false){
 if(syncing||busy)return;if(!cfg.url){if(manual)toast('Vào Cài đặt để kết nối sheet.');return;}
 if($('#transaction-form')||$('#bulk-form')){if(manual)toast('Lưu hoặc đóng biểu mẫu trước khi đồng bộ.');return;}
 syncing=true;status();const currentEpoch=epoch;
 try{const r=await request({action:'list'});if(currentEpoch!==epoch)return;if(!Array.isArray(r.records))throw new Error('Phản hồi không hợp lệ.');data=r.records;isDemo=false;lastSync=r.syncedAt;syncError='';selected.clear();render();if(manual)toast('Đã đồng bộ với Raw data.');}
 catch(e){if(currentEpoch===epoch){toast(e.message);syncError=e.message;}}
 finally{syncing=false;status();}
}
async function save(action,payload,form){if(busy)return;busy=true;form.querySelectorAll('button').forEach(b=>b.disabled=true);status();let saved=false;
 try{
 if(isDemo){if(cfg.url)throw new Error('Chưa đồng bộ được dữ liệu thật. Đóng biểu mẫu và kết nối trước khi lưu.');if(action==='add')data.unshift({...payload.patch,id:payload.id,version:payload.id,source:'Nhập tay'});else payload.items.forEach(x=>Object.assign(data.find(r=>r.id===x.id),x.patch));}
 else await request({action,...payload});saved=true;closeModal();selected.clear();if(tab==='plus'){tab='list';query='';filter='all';merchantFilter='';categoryFilter='';periodMode='month';$('#month').value=payload.patch.date.slice(0,7);}render();toast(isDemo?'Đã lưu trong dữ liệu mẫu.':'Đã lưu vào Raw data.');
 }catch(e){toast(e.message);}finally{busy=false;form.querySelectorAll('button').forEach(b=>b.disabled=false);status();}
 if(saved&&!isDemo)await sync();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||busy)return;
 if(b.dataset.tab){tab=b.dataset.tab;closeModal();render();window.scrollTo(0,0);}
 if(b.dataset.period){periodMode=b.dataset.period;selected.clear();limit=50;render();}
 if(b.dataset.edit)edit(b.dataset.edit);
 if(b.dataset.close)closeModal();
 if(b.dataset.unknown){tab='list';filter='unknown';query='';merchantFilter='';categoryFilter='';render();}
 if(b.dataset.filter){filter=b.dataset.filter;selected.clear();limit=50;render();}
 if(b.dataset.drill){tab='list';filter='all';query='';merchantFilter='';categoryFilter='';if(b.dataset.drill==='merchant')merchantFilter=b.dataset.value;else if(b.dataset.drill==='category')categoryFilter=b.dataset.value;else query=b.dataset.value;render();window.scrollTo(0,0);}
 if(b.dataset.clearDrill){merchantFilter='';categoryFilter='';render();}
 if(b.dataset.more){limit+=50;render();}
 if(b.dataset.selectAll){selected=new Set(filtered().slice(0,500).map(r=>r.id));render();}
 if(b.dataset.deselect){selected.clear();render();}
 if(b.dataset.bulk)bulk();
 if(b.dataset.disconnect){resetBridge();cfg.url='';syncError='';localStorage.setItem('centurion-config',JSON.stringify(cfg));data=demoRecords();isDemo=true;lastSync='';selected.clear();render();toast(APPS_SCRIPT_URL?'Đã tạm ngắt. Mở lại app sẽ kết nối URL trong code.':'Đã ngắt kết nối.');}
 if(b.dataset.export)exportCsv();
});
document.addEventListener('change',e=>{if(e.target.dataset.select){if(e.target.checked){if(selected.size>=500){e.target.checked=false;toast('Mỗi lần tối đa 500 dòng.');return;}selected.add(e.target.dataset.select);}else selected.delete(e.target.dataset.select);$('#bulk-holder').innerHTML=bulkBar();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;limit=50;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);}});
$('#year').addEventListener('change',()=>{selectedYear=$('#year').value;selected.clear();limit=50;render();});$('#month').addEventListener('change',()=>{if(!$('#month').value)return;selected.clear();limit=50;render();});$('#refresh').addEventListener('click',()=>sync(true));
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target,fd=new FormData(f);
 if(f.id==='range-form'){const a=$('#date-start').value,b=$('#date-end').value;if(!a||!b||a>b){toast('Ngày bắt đầu phải nhỏ hơn hoặc bằng ngày kết thúc.');return;}rangeStart=a;rangeEnd=b;periodMode='range';selected.clear();limit=50;render();return;}
 if(f.id==='settings-form'){const url=String(fd.get('url')).trim();if(!validUrl(url)){toast('URL phải có dạng https://script.google.com/macros/s/…/exec');return;}if(syncing){toast('Đợi lần đồng bộ hiện tại kết thúc.');return;}resetBridge();cfg.url=url;localStorage.setItem('centurion-config',JSON.stringify(cfg));await sync(true);}
 if(f.id==='budget-form'){cfg.budget=Math.max(0,Number(fd.get('budget'))||0);localStorage.setItem('centurion-config',JSON.stringify(cfg));toast('Đã lưu ngân sách trên thiết bị này.');}
 if(f.id==='transaction-form'){
 const patch=Object.fromEntries(fd);patch.debit=-Math.abs(Number(patch.debit));patch.credit=Number(patch.credit)||0;
 if(!patch.debit&&!patch.credit){toast('Nhập số tiền chi ra hoặc nhận vào.');return;}
 if(!f.dataset.id){if(!f.dataset.newId)f.dataset.newId='app_'+crypto.randomUUID();await save('add',{id:f.dataset.newId,patch},f);}
 else await save('update',{items:[{id:f.dataset.id,version:f.dataset.version,patch}]},f);
 }
 if(f.id==='bulk-form'){const patch={};['merchant','category','include','classification'].forEach(k=>{if(fd.get('use-'+k))patch[k]=fd.get(k);});if(!Object.keys(patch).length){toast('Chọn trường cần cập nhật.');return;}const items=[...selected].map(id=>({id,version:data.find(r=>r.id===id).version,patch}));await save('update',{items},f);}
});
function exportCsv(){const keys=['date','source','detail','merchant','category','debit','credit','include','payment','status'];const safe=v=>{v=String(v??'');if(/^[=+@\-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};const text='\ufeff'+[keys.map(safe).join(','),...selectedRecords().map(r=>keys.map(k=>safe(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='priority-'+(periodMode==='year'?selectedYear:periodMode==='range'?rangeStart+'_'+rangeEnd:$('#month').value)+(isDemo?'-demo':'')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
setInterval(()=>{if(document.visibilityState==='visible')sync();},60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync();});
data=demoRecords();render();if(cfg.url){if(validUrl(cfg.url))sync();else{syncError='URL trong cấu hình không hợp lệ. Cần URL Apps Script /exec.';status();}}
</script></body></html>
